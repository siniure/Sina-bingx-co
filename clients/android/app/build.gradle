plugins { id 'com.android.application' }
def releaseSecrets = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def releaseReady = releaseSecrets.every { System.getenv(it) } && file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'missing').isFile()
android {
    namespace 'com.sina.oco'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sina.oco'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.4.1'
    }
    signingConfigs {
        if (releaseReady) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (releaseReady) { signingConfig signingConfigs.release }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !releaseReady) {
        throw new GradleException('Release signing is not configured in secure build settings. Use assembleDebug for a test APK.')
    }
}
