name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug for initial device test; release requires the owner signing secrets'
        required: true
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK requirements
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare owner release key when selected
        if: inputs.variant == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names=['ANDROID_KEYSTORE_BASE64','ANDROID_KEYSTORE_PASSWORD','ANDROID_KEY_ALIAS','ANDROID_KEY_PASSWORD']
          if not all(os.environ.get(name) for name in names):
              raise SystemExit('Owner Android signing secrets must be configured in GitHub Actions Secrets.')
          path=Path(os.environ['RUNNER_TEMP'])/'sina-release.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Build initial test APK
        if: inputs.variant == 'debug'
        working-directory: clients/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Build owner-signed release APK
        if: inputs.variant == 'release'
        working-directory: clients/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sina-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "clients/android/app/build/outputs/apk/${{ inputs.variant }}/app-${{ inputs.variant }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SinaOCO-Android-${{ inputs.variant }}-APK
          path: clients/android/app/build/outputs/apk/${{ inputs.variant }}/app-${{ inputs.variant }}.apk
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/sina-release.jks"
